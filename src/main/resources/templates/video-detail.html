<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('视频详情')}"></head>
<body>
<header th:replace="~{fragments :: nav('videos')}"></header>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <div class="page-title">
        <h1 th:text="'视频 #' + ${video.id}"></h1>
        <span class="hint" th:text="${video.cameraName} + ' · ' + ${video.deviceSerial} + ' / 通道 ' + ${video.channelNo}"></span>
    </div>

    <div class="grid cols-4" style="margin-bottom:18px">
        <div class="stat"><div class="label">开始时间</div>
            <div class="value" style="font-size:16px" th:text="${#temporals.format(video.beginTime,'yyyy-MM-dd HH:mm:ss')}"></div></div>
        <div class="stat"><div class="label">结束时间</div>
            <div class="value" style="font-size:16px" th:text="${#temporals.format(video.endTime,'yyyy-MM-dd HH:mm:ss')}"></div></div>
        <div class="stat"><div class="label">视频时长</div>
            <div class="value primary" th:text="${#numbers.formatDecimal(video.durationSec/60,1,1)} + ' 分钟'"></div></div>
        <div class="stat"><div class="label">文件大小</div>
            <div class="value" th:text="${#numbers.formatDecimal(video.fileSize/1048576.0,1,1)} + ' MB'"></div></div>
    </div>

    <div class="card">
        <h2>视频播放</h2>
        <video th:if="${video.status == 'READY'}" controls preload="metadata" style="width:100%;max-height:560px;background:#000;border-radius:10px"
               th:src="@{'/videos/' + ${video.id} + '/stream'}"></video>
        <div class="empty" th:unless="${video.status == 'READY'}">
            当前状态：<span class="badge" th:classappend="${video.status}" th:text="${video.status}"></span>
            <span th:if="${video.message}" th:text="' - ' + ${video.message}"></span>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn ghost" th:if="${video.status == 'READY'}"
               th:href="@{'/videos/' + ${video.id} + '/stream(download=true)'}">下载视频文件</a>
            <span class="mono muted" th:text="${video.relPath}"></span>
        </div>
    </div>

    <div class="card">
        <h2>提交特征分析</h2>
        <form th:action="@{'/videos/' + ${video.id} + '/analyze'}" method="post"
              class="form-grid" style="align-items:end">
            <div>
                <label>算法任务（逗号分隔）</label>
                <input name="tasks" value="focus,distraction,hands,phone,audio" th:disabled="${video.status != 'READY'}">
            </div>
            <div>
                <button class="btn" type="submit" th:disabled="${video.status != 'READY'}">开始分析</button>
            </div>
        </form>
        <p class="muted" style="margin:12px 0 0">
            focus=专注度，distraction=走神，hands=玩手/小动作，phone=玩手机，audio=音频转文本
        </p>
    </div>

    <div class="card">
        <h2>分析任务记录</h2>
        <table th:if="${!#lists.isEmpty(tasks)}">
            <thead>
            <tr><th>任务</th><th>算法</th><th>状态</th><th>创建时间</th><th>报告</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tasks}">
                <td th:text="'#' + ${t.id}"></td>
                <td class="mono" th:text="${t.tasks}"></td>
                <td><span class="badge" th:classappend="${t.status}" th:text="${t.status}"></span></td>
                <td class="mono" th:text="${#temporals.format(t.createdAt,'MM-dd HH:mm:ss')}"></td>
                <td>
                    <a th:if="${t.reportId != null}" th:href="@{'/reports/' + ${t.reportId}}">查看报告</a>
                    <span th:unless="${t.reportId != null}" class="muted">-</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(tasks)}">暂无分析任务</div>
    </div>

    <div class="card" th:if="${report != null}">
        <h2>最新报告摘要</h2>
        <div class="grid cols-4">
            <div class="stat"><div class="label">学习时长</div>
                <div class="value success" th:text="${#numbers.formatDecimal(report.studyDurationSec/60,1,1)} + ' 分'"></div></div>
            <div class="stat"><div class="label">专注度</div>
                <div class="value primary" th:text="${report.focusScore} + ' 分'"></div></div>
            <div class="stat"><div class="label">走神</div>
                <div class="value warn" th:text="${#numbers.formatDecimal(report.distractedSec/60,1,1)} + ' 分'"></div></div>
            <div class="stat"><div class="label">玩手机</div>
                <div class="value warn" th:text="${#numbers.formatDecimal(report.phoneSec/60,1,1)} + ' 分'"></div></div>
        </div>
        <div class="pre" style="margin-top:12px" th:text="${report.overallSummary}"></div>
        <a class="btn" style="margin-top:12px" th:href="@{'/reports/' + ${report.id}}">查看完整报告</a>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
