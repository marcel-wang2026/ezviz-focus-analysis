<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('登录')}"></head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h1>学习专注度分析平台</h1>
        <p class="sub">萤石录像定时下载归档 + 作业专注度分析</p>

        <div class="alert error" th:if="${param.error}">用户名或密码错误</div>
        <div class="alert success" th:if="${param.logout}">已安全退出</div>

        <form th:action="@{/login}" method="post">
            <div style="margin-bottom:14px">
                <label for="username">用户名</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div>
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">登录</button>
        </form>
        <p class="sub" style="margin-top:18px">默认账号：admin / admin123（首次登录后请修改）</p>
    </div>
</div>
</body>
</html>
